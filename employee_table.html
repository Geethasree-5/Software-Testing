<!DOCTYPE html>
<html>
<head>
    <title>Employee Table</title>

    <style>
        table{
            border-collapse:collapse;
            width:60%;
        }

        table,th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }
    </style>
</head>

<body>

<h2>Employee Records</h2>

<table id="employeeTable">

    <tr>
        <th>Name</th>
        <th>Department</th>
        <th>Salary</th>
    </tr>

    <tr>
        <td>Alice</td>
        <td>HR</td>
        <td>45000</td>
    </tr>

    <tr>
        <td>Johndoe</td>
        <td>IT</td>
        <td>75000</td>
    </tr>

    <tr>
        <td>David</td>
        <td>Finance</td>
        <td>60000</td>
    </tr>

</table>

</body>
</html>
